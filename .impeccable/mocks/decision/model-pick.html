<!doctype html><html><head><meta charset="utf-8"><title>Dabba codes</title>
<style>
:root{--wash:#eef0ea;--steel:#c8ccc9;--ink:#1d2024;--saff:#ee8a1d;--leaf:#1f8a4c;--sindoor:#c8282a;--indigo:#2b3f9a}
*{box-sizing:border-box;margin:0}body{width:1440px;height:900px;background:var(--wash);font-family:Arial,sans-serif;color:var(--ink);overflow:hidden}
nav{display:flex;justify-content:space-between;padding:24px 64px;font:700 15px/1 Arial}
h1{position:absolute;left:64px;top:110px;font:900 96px/0.95 Arial;width:760px;letter-spacing:-.02em}
p{position:absolute;left:64px;top:430px;width:560px;font-size:20px;line-height:1.45}
a{position:absolute;left:64px;top:540px;background:var(--ink);color:#fff;padding:18px 26px;font-weight:700;text-decoration:none}
.lids{position:absolute;right:64px;top:110px;display:grid;grid-template-columns:repeat(3,190px);gap:22px}
.lid{width:190px;height:190px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#f4f5f3,var(--steel) 70%);display:grid;place-items:center;font:900 44px/1 Arial;position:relative}
.lid span{padding:4px 10px;color:#fff}.s{background:var(--saff)}.g{background:var(--leaf)}.r{background:var(--sindoor)}.i{background:var(--indigo)}
</style></head><body>
<nav><span>Food Rescue Network</span><span>Sign in</span></nav>
<h1>Every box knows where it is going.</h1>
<p>Each rescue carries a painted route code from donor to NGO, read at every relay handoff until the food arrives.</p>
<a href="#">Report surplus food</a>
<div class="lids"><div class="lid"><span class="s">D4</span></div><div class="lid"><span class="g">N7</span></div><div class="lid"><span class="r">V2</span></div><div class="lid"><span class="i">K9</span></div><div class="lid"><span class="s">3B</span></div><div class="lid"><span class="g">✓</span></div></div>
</body></html>
